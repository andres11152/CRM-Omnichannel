# 🐳 STACK LOCAL — Paridad exacta con Render (staging)
#
# Versiones espejo de Render (verificadas el 2026-06-24):
#   - Postgres 18.x   (Render: PostgreSQL 18.3)
#   - Redis 7.2.4     (Render: 7.2.4, maxmemory 256M, policy noeviction)
#
# Este stack es AISLADO: tiene su propia BD/Redis con datos locales. El backend
# local debe apuntar AQUÍ (ver backend/.env), nunca a Render, para no provocar
# el conflicto de sesión de WhatsApp (stream:error conflict / chats duplicados).
#
# Uso:
#   docker compose up -d              # levanta Postgres + Redis
#   docker compose down              # detiene (conserva datos)
#   docker compose down -v           # detiene y BORRA el volumen (reset total)
#
# ⚠️ Si antes corriste Postgres 15/16, el volumen viejo NO arranca en PG18.
#    Ejecuta una vez:  docker compose down -v   y luego  docker compose up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: reply-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: reply_user
      POSTGRES_PASSWORD: reply_password
      POSTGRES_DB: reply_db_local
    ports:
      - "5433:5432"
    volumes:
      # PG18+ requiere el mount en /var/lib/postgresql (no en /data); guarda los
      # datos en un subdirectorio por versión mayor (compat. pg_upgrade).
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reply_user -d reply_db_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    container_name: reply-redis-local
    restart: unless-stopped
    # Espejo de la config de Render: 256MB y noeviction (rechaza escrituras al
    # llenarse, en vez de evictar). Reproduce localmente el comportamiento de
    # Redis OOM de producción para detectarlo antes de desplegar.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO — almacenamiento S3-compatible para emular AWS S3 en local.
  # Mismo código/SDK que prod (STORAGE_PROVIDER=s3), datos 100% separados.
  # API: http://localhost:9000  ·  Consola web: http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: reply-minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_local:/data

  # One-shot: espera a MinIO y crea el bucket local (idempotente).
  minio-init:
    image: minio/mc:latest
    container_name: reply-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'esperando a minio...'; sleep 2; done;
      /usr/bin/mc mb -p local/reply-media-local || true;
      /usr/bin/mc anonymous set download local/reply-media-local || true;
      echo 'bucket reply-media-local listo';
      "

  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: reply-whatsapp-service-local
    restart: unless-stopped
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://reply_user:reply_password@postgres:5432/reply_db_local
      - REDIS_URL=redis://redis:6379
      - PORT=4001
      - WA_SYNC_FULL_HISTORY=false
      # Local-only shared secret between backend and whatsapp-service (see
      # backend/.env's matching WHATSAPP_INTERNAL_SECRET). Never reuse the
      # production value here — this container never talks to Render.
      - WHATSAPP_INTERNAL_SECRET=local-dev-only-secret
    volumes:
      - ./whatsapp-service/data:/app/data

volumes:
  postgres_data_18:
  redis_data_local:
  minio_data_local:
