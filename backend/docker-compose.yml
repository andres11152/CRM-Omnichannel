version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: reply-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-replycrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${DB_NAME:-replycrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-replycrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reply-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: reply-crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - reply-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reply-crm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-replycrm}:${DB_PASSWORD:-change_me_in_production}@postgres:5432/${DB_NAME:-replycrm}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Memory configuration is in Dockerfile via NODE_OPTIONS
    ports:
      - "4000:4000"
    volumes:
      - ./public:/app/public
      - ./logs:/app/logs
      - whatsapp_sessions:/app/.wwebjs_auth
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - reply-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: reply-crm-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - reply-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: reply-crm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - reply-network

  # Jaeger Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: reply-crm-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
      - "4317:4317"    # OTLP gRPC receiver
    networks:
      - reply-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  whatsapp_sessions:

networks:
  reply-network:
    driver: bridge