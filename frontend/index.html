<!doctype html>
<html lang="es">
  <head>
    <script>
      // 🚑 EMERGENCY: Force unregister all service workers immediately
      // 🚑 EMERGENCY: Force unregister all service workers immediately
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            let found = false;
            for (let registration of registrations) {
              console.log("Unregistering SW:", registration);
              registration.unregister();
              found = true;
            }
            // Force reload if we just killed a worker to clear cache
            if (found && !sessionStorage.getItem("sw_killed")) {
              sessionStorage.setItem("sw_killed", "true");
              window.location.reload();
            }
          });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reply Software - Español</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Dark mode scrollbar */
      .dark ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #121212;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #333333;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      /* Flow Builder Animations */
      @keyframes flowAnimation {
        from {
          stroke-dashoffset: 20;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      .animate-flow-line {
        animation: flowAnimation 1s linear infinite;
      }
    </style>
  </head>
  <body
    class="bg-reply-bg text-reply-text dark:bg-reply-bg-dark dark:text-reply-text-dark antialiased transition-colors duration-200"
  >
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
